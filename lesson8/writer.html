<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .writer {
            font-family: 'Courier New', Courier, monospace;
            font-size: 24px;
            line-height: 1.4;
            --chars: 13;

            display: inline-block;
            overflow: hidden;
            white-space: nowrap;
            border-right: 3px solid black;

            /*
                0%~40%   打字（2.4s）
                40%~50%  停顿（0.6s）
                50%~90%  删除（2.4s）
                90%~100% 停顿（0.6s）
            */
            animation:
                type-delete 6s steps(var(--chars)) infinite,
                blink 0.6s step-end infinite;
        }

        @keyframes type-delete {
            0%   { width: 0; }
            40%  { width: calc(var(--chars) * 1ch); }
            50%  { width: calc(var(--chars) * 1ch); }
            90%  { width: 0; }
            100% { width: 0; }
        }

        @keyframes blink {
            50% { border-color: transparent; }
        }
    </style>
</head>
<body>
    <div class="writer">hello world!</div>
</body>
</html>
